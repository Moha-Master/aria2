name: manual-build-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: master
    - name: Linux setup
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          file \
          autoconf \
          automake \
          autotools-dev \
          autopoint \
          libtool \
          pkg-config \
          libssl-dev \
          libxml2-dev \
          libc-ares-dev \
          zlib1g-dev \
          libzstd-dev \
          liblzma-dev \
          libgpg-error-dev \
          libjitterentropy3-dev \
          libsqlite3-dev \
          libssh2-1-dev
    - name: macOS setup
      if: runner.os == 'macOS'
      run: |
        brew install gettext openssl libssh2 c-ares sqlite3 autoconf automake pkg-config libtool
        echo 'CC=clang' >> "$GITHUB_ENV"
        echo 'CXX=clang++' >> "$GITHUB_ENV"
    - name: Build native aria2
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          # gettext 新版宏与 AM_GNU_GETTEXT_VERSION([0.19]) 失配（Debian gettext-0.23.patch 同思路，行号适配 master）
          sed -i 's/AM_GNU_GETTEXT_VERSION(\[0.19\])/AM_GNU_GETTEXT_REQUIRE_VERSION([0.21])/' configure.ac
        fi
        autoreconf -i
        if [ "$RUNNER_OS" = "Linux" ]; then
          ./configure ARIA2_STATIC=yes \
            --without-gnutls --with-openssl \
            --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt
        else
          ./configure --without-openssl --without-gnutls --with-appletls --disable-nls
        fi
        make -j"$(nproc 2> /dev/null || sysctl -n hw.ncpu)"
    - name: Package native artifact
      shell: bash
      run: |
        mkdir -p out
        if [ "$RUNNER_OS" = "Linux" ]; then
          file src/aria2c | grep -q 'statically linked'
          strip src/aria2c
          cp src/aria2c out/aria2c-linux-x86_64
          tar -czf out/aria2c-linux-x86_64.tar.gz -C out aria2c-linux-x86_64
        else
          strip -x src/aria2c || strip src/aria2c
          cp src/aria2c out/aria2c-macos-arm64
          tar -czf out/aria2c-macos-arm64.tar.gz -C out aria2c-macos-arm64
        fi
    - name: Upload native artifact
      uses: actions/upload-artifact@v4
      with:
        name: aria2-${{ runner.os }}
        path: out/*.tar.gz

  build-windows:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: master
    - name: Build Windows binary via Docker
      run: |
        docker build -f Dockerfile.mingw \
          --build-arg HOST=x86_64-w64-mingw32 \
          -t aria2-mingw .
        cid="$(docker create aria2-mingw)"
        docker cp "$cid:/aria2/src/aria2c.exe" ./aria2c-windows-x86_64.exe
        docker rm "$cid"
        zip -j aria2c-windows-x86_64.zip aria2c-windows-x86_64.exe
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: aria2-windows
        path: aria2c-windows-x86_64.zip

  build-android:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: master
    - name: Build Android binary via Docker
      run: |
        docker build -f Dockerfile.android -t aria2-android .
        cid="$(docker create aria2-android)"
        docker cp "$cid:/root/build/aria2/src/aria2c" ./aria2c-android-aarch64
        docker rm "$cid"
        tar -czf aria2c-android-aarch64.tar.gz aria2c-android-aarch64
    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: aria2-android
        path: aria2c-android-aarch64.tar.gz

  release:
    needs: [build-native, build-windows, build-android]
    runs-on: ubuntu-26.04
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Generate release date
      id: meta
      run: |
        release_date="$(date -u '+%y.%-m.%-d')"
        suffix="$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date -u +%s%N)" | sha256sum | cut -c1-6)"
        release_name="${release_date}-${suffix}"
        echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
    - name: Publish GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.meta.outputs.release_name }}
        name: ${{ steps.meta.outputs.release_name }}
        artifacts: "dist/*"
        generateReleaseNotes: true
